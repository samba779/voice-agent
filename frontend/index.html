<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk to AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .call-button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .call-button.start {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }

        .call-button.end {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
            animation: pulse 1.5s infinite;
        }

        .call-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .call-button:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 10px 30px rgba(244, 67, 54, 0.3);
            }
            50% {
                box-shadow: 0 10px 50px rgba(244, 67, 54, 0.6);
            }
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status.idle {
            background: #f5f5f5;
            color: #666;
        }

        .status.connecting {
            background: #fff3cd;
            color: #856404;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.ended {
            background: #e2e3e5;
            color: #383d41;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .info-text {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
            line-height: 1.6;
        }

        .volume-indicator {
            margin-top: 15px;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
        }

        .volume-bar {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.1s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ AI Voice Assistant</h1>
        <p class="subtitle">Click the button to start talking</p>
        
        <button id="callButton" class="call-button start" onclick="toggleCall()">
            Start
        </button>
        
        <div id="status" class="status idle">
            Ready to connect
        </div>
        
        <div class="volume-indicator">
            <div id="volumeBar" class="volume-bar"></div>
        </div>
        
        <p class="info-text">
            Make sure to allow microphone access when prompted.<br>
            Works best on Chrome, Safari, or Firefox.
        </p>
    </div>

    <!-- Import Vapi Web SDK - Official CDN -->
    <script>
        var vapiInstance = null;
        const apiKey = "87d24af0-8019-44ed-9b4d-58f212ba6eaa";  // Your Public API Key
        const assistant = "b1c156ec-9684-436f-add7-f0e7c93be851";  // Your Assistant ID
        const buttonConfig = {};  // Optional button configuration

        (function (d, t) {
            var g = document.createElement(t),
                s = d.getElementsByTagName(t)[0];
            g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
            g.defer = true;
            g.async = true;
            s.parentNode.insertBefore(g, s);

            g.onload = function () {
                console.log('Vapi SDK loaded successfully');
                try {
                    vapiInstance = window.vapiSDK.run({
                        apiKey: apiKey,
                        assistant: assistant,
                        config: buttonConfig
                    });
                    console.log('Vapi initialized successfully:', vapiInstance);
                } catch (error) {
                    console.error('Vapi initialization error:', error);
                    document.getElementById("status").className = "status error";
                    document.getElementById("status").textContent = "❌ Error: " + error.message;
                }
            };

            g.onerror = function() {
                console.error('Vapi SDK failed to load');
                document.getElementById("status").className = "status error";
                document.getElementById("status").textContent = "❌ Error: Vapi SDK failed to load. Check your internet connection.";
            };
        })(document, "script");
    </script>
    <script>
        let isCalling = false;

        function toggleCall() {
            const button = document.getElementById("callButton");
            const status = document.getElementById("status");

            // Check if Vapi is properly initialized
            if (!vapiInstance) {
                status.className = "status error";
                status.textContent = "❌ Error: Vapi not initialized. Wait for SDK to load or refresh the page.";
                console.error('Cannot start call - vapiInstance is null');
                return;
            }

            if (!isCalling) {
                // Start call
                console.log('Starting call...');
                try {
                    vapiInstance.start();
                    button.textContent = "End";
                    button.className = "call-button end";
                    status.className = "status connecting";
                    status.textContent = "Connecting to assistant...";
                    isCalling = true;
                    
                    // Add timeout for connection
                    setTimeout(() => {
                        if (status.textContent === "Connecting to assistant...") {
                            status.className = "status error";
                            status.textContent = "❌ Connection timeout. Check console for details.";
                            console.error('Connection timeout - check Vapi credentials and assistant status');
                        }
                    }, 10000);
                } catch (error) {
                    console.error('Error starting call:', error);
                    status.className = "status error";
                    status.textContent = "❌ Error: " + error.message;
                }
            } else {
                // End call
                console.log('Ending call...');
                vapiInstance.stop();
                button.textContent = "Start";
                button.className = "call-button start";
                status.className = "status ended";
                status.textContent = "Call ended. Processing summary...";
                isCalling = false;
            }
        }

        // Vapi event listeners
        if (vapiInstance) {
            vapiInstance.on("call-start", () => {
                const status = document.getElementById("status");
                status.className = "status connected";
                status.textContent = "✅ Connected! Speak now...";
            });

            vapiInstance.on("call-end", () => {
                const button = document.getElementById("callButton");
                const status = document.getElementById("status");
                status.className = "status ended";
                status.textContent = "📞 Call finished. Check backend for summary.";
                button.textContent = "Start";
                button.className = "call-button start";
                isCalling = false;
            });

            vapiInstance.on("error", (error) => {
                const status = document.getElementById("status");
                status.className = "status error";
                status.textContent = "❌ Error: " + error.message;
                console.error("Vapi error:", error);
            });

            // Volume indicator (optional visual feedback)
            vapiInstance.on("speech-start", () => {
                document.getElementById("volumeBar").style.width = "80%";
            });

            vapiInstance.on("speech-end", () => {
                document.getElementById("volumeBar").style.width = "0%";
            });
        }
    </script>
</body>
</html>
